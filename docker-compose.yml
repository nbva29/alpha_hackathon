services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: alfa_credit
      POSTGRES_USER: alfa
      POSTGRES_PASSWORD: alfa_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alfa -d alfa_credit"]
      interval: 5s
      timeout: 3s
      retries: 20

  bank-mock:
    build: ./bank-mock
    environment:
      BANK_INTERNAL_KEY: ${BANK_INTERNAL_KEY:-local-bank-mock-key-change-me}
    expose:
      - "8001"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://alfa:alfa_dev_password@postgres:5432/alfa_credit
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-this-secret-to-a-long-random-value}
      SESSION_HOURS: 8
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080
      BANK_MOCK_URL: http://bank-mock:8001
      BANK_INTERNAL_KEY: ${BANK_INTERNAL_KEY:-local-bank-mock-key-change-me}
      UPLOAD_DIR: /data/uploads
      DEMO_SEED_PASSWORD: ${DEMO_SEED_PASSWORD:-demo123}
      AI_BASE_URL: ${AI_BASE_URL-http://host.docker.internal:1234/v1}
      AI_MODEL: ${AI_MODEL:-qwen3-4b-instruct-2507}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_ALLOW_REMOTE: ${AI_ALLOW_REMOTE:-false}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-30}
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      bank-mock:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  ollama:
    image: ollama/ollama:0.40.10
    profiles: [ai]
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  uploads_data:
  ollama_data:
